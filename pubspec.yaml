name: nexus
description: "Nexus — Local-first AI intelligence hub."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  html: ^0.15.4
  xml: ^6.5.0
  crypto: ^3.0.5
  url_launcher: ^6.3.0
  webview_flutter: ^4.9.0
  workmanager: ^0.9.0

dependency_overrides:
  # workmanager 0.9.4's Apple/Android implementations lag the platform
  # interface by one named parameter; pin to the matching 0.9.1 API.
  workmanager_platform_interface: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
