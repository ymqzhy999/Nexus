name: Build Nexus APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Generate Android host project
        run: flutter create --org com.nexus --project-name nexus --platforms=android .

      - name: Patch Android config
        run: python3 tool/patch_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Collect APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Nexus.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Nexus v0.1.0 — AI Intelligence Hub
          body: |
            Nexus — Local-first AI intelligence hub (Android).
            Download `Nexus.apk` below and install it on your phone.
            Configure your DeepSeek API key in Settings.
          files: Nexus.apk
          make_latest: true
