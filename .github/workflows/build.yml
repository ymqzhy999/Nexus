name: Build Nexus APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true

      - name: Generate Android host project
        run: flutter create --org com.nexus --project-name nexus --platforms=android .

      - name: Patch Android config
        run: python3 tool/patch_android.py

      - name: Resolve packages
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Unit tests
        run: flutter test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Collect APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Nexus.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          name: Nexus v0.4.2 — Crawler
          body: |
            Nexus v0.4.0 — 统计年鉴爬虫
            关键词 → 站点 → 全站抓表；不再需要 URL。
            - 站点库：国家统计局/中国统计年鉴/省份年鉴/数据开放平台
            - 站内 BFS 抓取：HTML 表格、XLSX、CSV、frame 链接
            - 宽表转长表、目录表过滤、关键词/年份过滤
            - 数据集预览 + Excel/PDF/CSV 导出到下载目录
            - 数据集/任务批量删除
            AI 仅用于可选「选站点」，不参与数据计算。
          files: Nexus.apk
          make_latest: true
